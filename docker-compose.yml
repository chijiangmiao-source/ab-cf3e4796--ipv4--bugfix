# 航电地面站 TCP 指令流复核
# 可配置宿主端口：HOST_PORT 环境变量（默认 8080）
#   app     —— 静态页面 + /healthz
#   verify  —— 重组规则测试 + 页面构建 + HTTP 冒烟，一次运行后以退出码结束
services:
  app:
    build: .
    image: tcp-stream-replay-check:latest
    environment:
      PORT: 8080
    ports:
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  verify:
    build: .
    image: tcp-stream-replay-check:latest
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: "http://app:8080"
    command: ["node", "verify/verify.mjs"]
    restart: "no"
